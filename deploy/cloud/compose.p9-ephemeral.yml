services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [validation_internal]
    mem_limit: 512m
    cpus: 0.50

  api:
    image: agm-api:p9-ephemeral-offline-20260815-001
    restart: "no"
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_HOPS: 0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      CORS_ALLOWED_ORIGINS: http://127.0.0.1
    ports:
      - "127.0.0.1:${VALIDATION_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
    networks: [validation_internal]
    mem_limit: 768m
    cpus: 0.75

volumes:
  postgres_data: {}

networks:
  validation_internal:
    driver: bridge
    internal: true
