name: agm-production

services:
  api:
    image: "${AGM_IMAGE:?AGM_IMAGE must be set by Release & Operations}"
    pull_policy: never
    container_name: agm-production-api
    restart: unless-stopped
    env_file:
      - /opt/agm/production/secrets/agm-production.env
    environment:
      AGM_TURN_ADMIN_ACCESS_MODE: open-pre-release
      AGM_REVISION: "${AGM_REVISION:?AGM_REVISION must be set by Release & Operations}"
      AGM_PRODUCTION_PREFLIGHT_REPORT_PATH: /run/agm/production-preflight.latest.json
    volumes:
      - /opt/agm/production/runtime/production-preflight.latest.json:/run/agm/production-preflight.latest.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      org.opencontainers.image.revision: "${AGM_REVISION:?AGM_REVISION must be set by Release & Operations}"
      agm.environment: production
      agm.database.container: agm-postgres
      agm.database.volume: app_agm_postgres_data
    networks:
      - agm_production_database

networks:
  agm_production_database:
    external: true
    name: app_default
