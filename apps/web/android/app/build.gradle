apply plugin: 'com.android.application'

ext.releaseSigning = [
    storeFile: System.getenv('AGM_ANDROID_RELEASE_KEYSTORE'),
    storePassword: System.getenv('AGM_ANDROID_RELEASE_STORE_PASSWORD'),
    keyAlias: System.getenv('AGM_ANDROID_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('AGM_ANDROID_RELEASE_KEY_PASSWORD')
]
ext.releaseSigningInputsPresent = project.ext.releaseSigning.values().every {
    it != null && !it.trim().isEmpty()
}
ext.releaseSigningKeystore = project.ext.releaseSigningInputsPresent
    ? file(project.ext.releaseSigning.storeFile)
    : null
ext.releaseSigningConfigured = project.ext.releaseSigningInputsPresent
    && project.ext.releaseSigningKeystore.isFile()

android {
    namespace = "com.agm.cockpit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agm.cockpit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (project.ext.releaseSigningConfigured) {
            release {
                storeFile project.ext.releaseSigningKeystore
                storePassword project.ext.releaseSigning.storePassword
                keyAlias project.ext.releaseSigning.keyAlias
                keyPassword project.ext.releaseSigning.keyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        storageTest {
            initWith debug
            applicationIdSuffix ".storagetest"
            versionNameSuffix "-storage-test"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.ext.releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && (task.name == 'bundleRelease' || task.name == 'assembleRelease')
    }
    if (releaseRequested && !project.ext.releaseSigningInputsPresent) {
        throw new GradleException('AGM_ANDROID_RELEASE_SIGNING_NOT_CONFIGURED: set AGM_ANDROID_RELEASE_KEYSTORE, AGM_ANDROID_RELEASE_STORE_PASSWORD, AGM_ANDROID_RELEASE_KEY_ALIAS, and AGM_ANDROID_RELEASE_KEY_PASSWORD')
    }
    if (releaseRequested && !project.ext.releaseSigningConfigured) {
        throw new GradleException('AGM_ANDROID_RELEASE_KEYSTORE_NOT_FOUND')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
