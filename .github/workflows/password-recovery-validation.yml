name: AGM Password Recovery Validation

on:
  pull_request:
    paths:
      - '.github/workflows/password-recovery-validation.yml'
      - 'apps/api/src/auth/**'
      - 'apps/api/src/communications/providers/gmail.provider.ts'
      - 'apps/api/test/*password-recovery*'
      - 'apps/api/scripts/test-password-recovery-db.ts'
      - 'apps/web/src/premium-access/**'
      - 'scripts/validate-password-recovery-browser.mjs'
      - 'prisma/**'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agm_recovery_test
          POSTGRES_PASSWORD: recovery-test-only
          POSTGRES_DB: agm_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U agm_recovery_test'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agm_recovery_test:recovery-test-only@127.0.0.1:5432/agm_recovery_test
      AGM_RECOVERY_TEST_DATABASE_URL: postgresql://agm_recovery_test:recovery-test-only@127.0.0.1:5432/agm_recovery_test
      JWT_SECRET: isolated-test-signing-key-not-for-production-1234567890
      OPENAI_API_KEY: isolated-test-placeholder-not-for-production
      VITE_AGM_API_BASE_URL: https://api.agmcockpit.com/api/v1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @agm/shared build
      - run: pnpm --filter @agm/library-control-plane build
      - run: pnpm --filter @agm/copilot-control-plane build
      - run: pnpm --filter @agm/api exec tsc --noEmit
      - run: pnpm --filter @agm/api exec eslint src/auth src/communications/providers/gmail.provider.ts
      - run: pnpm --filter @agm/api exec jest --runInBand test/password-recovery.spec.ts test/password-recovery-http.spec.ts test/password-recovery-mail-boundary.spec.ts test/api002-auth-users.spec.ts
      - name: Verify real migrations and concurrent reset/refresh transactions
        run: pnpm --filter @agm/api exec ts-node scripts/test-password-recovery-db.ts
      - run: pnpm --filter @agm/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm rescue:browser-preflight
      - run: node scripts/validate-password-recovery-browser.mjs
      - name: Preserve local-fixture Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-recovery-browser-${{ github.run_id }}
          path: evidence/password-recovery/browser
          if-no-files-found: warn
