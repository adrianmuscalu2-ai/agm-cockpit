name: AGM Atlas Custody Validation
on:
  pull_request:
    paths:
      - apps/api/scripts/production-atlas-custody.py
      - apps/api/test/test_atlas_custody.py
      - apps/api/test/commander-binding-authority.spec.ts
      - apps/api/test/user-machine-jwt-isolation.spec.ts
      - apps/api/src/auth/jwt.strategy.ts
      - apps/api/src/governance-v2/commander-binding-authority.ts
      - apps/api/scripts/activate-governance-v2-actors.ts
      - .github/workflows/production-governance-actor-binding.yml
      - .github/workflows/production-company-owner-preflight.yml
      - .github/workflows/production-release.yml
      - .github/workflows/atlas-custody-validation.yml
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test isolated Linux custody boundaries without Production credentials
        run: sudo python3 -m unittest discover -s apps/api/test -p test_atlas_custody.py
      - name: Check existing release phase separation
        run: node scripts/test-production-release-phase-separation.mjs
      - name: Check existing SSH transport
        run: node scripts/validate-production-ssh-transport.mjs
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @agm/api exec jest --runInBand test/commander-binding-authority.spec.ts test/user-machine-jwt-isolation.spec.ts
