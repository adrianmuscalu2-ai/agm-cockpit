name: Production ACP PostgreSQL Read-only Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-acp-readonly-verification
  cancel-in-progress: false

jobs:
  verify-production-acp-readonly:
    if: ${{ github.ref == 'refs/heads/agm-canonical-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_SSH_HOST_KEY_SHA256: ${{ vars.PRODUCTION_SSH_HOST_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify SSH pin and run bounded read-only role lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          fail() { printf 'ACPM_CHECK=BLOCKED reason=%s\n' "$1"; exit 1; }
          [[ -n "$PRODUCTION_HOST" && -n "$PRODUCTION_USER" && -n "$PRODUCTION_SSH_KEY" ]] || fail 'Production SSH environment values unavailable'
          if [[ ! "$PRODUCTION_SSH_HOST_KEY_SHA256" =~ ^SHA256:[A-Za-z0-9+/]+$ ]]; then
            scan_file="$RUNNER_TEMP/agm-production-host-key-probe"
            trap 'rm -f -- "$scan_file"' EXIT
            ssh-keyscan -T 8 -t ed25519 "$PRODUCTION_HOST" > "$scan_file" 2>/dev/null || fail 'SSH host-key scan failed'
            : > "$RUNNER_TEMP/agm-production-host-key-probes"
            while IFS= read -r key_line; do
              [[ -n "$key_line" ]] || continue
              [[ "$key_line" != \#* ]] || continue
              printf '%s\n' "$key_line" > "$RUNNER_TEMP/agm-production-host-key-candidate"
              fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/agm-production-host-key-candidate" -E sha256 | awk 'NR == 1 {print $2}')"
              printf 'ACPM_HOST_KEY_PROBE=%s\n' "$fingerprint" >> "$RUNNER_TEMP/agm-production-host-key-probes"
            done < "$scan_file"
            grep -Ev '^ACPM_HOST_KEY_PROBE=$' "$RUNNER_TEMP/agm-production-host-key-probes" || fail 'SSH host-key probe returned no Ed25519 fingerprint'
            rm -f -- "$RUNNER_TEMP/agm-production-host-key-candidate"
            exit 0
          fi
          [[ "$GITHUB_REF" == 'refs/heads/agm-canonical-20260820' ]] || fail 'workflow must run from agm-canonical-20260820'

          key_file="$RUNNER_TEMP/agm-production-ssh-key"
          known_hosts="$RUNNER_TEMP/agm-production-known-hosts"
          scan_file="$RUNNER_TEMP/agm-production-host-key-scan"
          candidate_file="$RUNNER_TEMP/agm-production-host-key-candidate"
          cleanup_runner() { rm -f -- "$key_file" "$known_hosts" "$scan_file" "$candidate_file"; }
          trap cleanup_runner EXIT
          umask 077
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$key_file"
          unset PRODUCTION_SSH_KEY

          ssh-keyscan -T 8 -t ed25519 "$PRODUCTION_HOST" > "$scan_file" 2>/dev/null || fail 'SSH host-key scan failed'
          scanned_fingerprint=''
          : > "$known_hosts"
          while IFS= read -r key_line; do
            [[ -n "$key_line" ]] || continue
            printf '%s\n' "$key_line" > "$candidate_file"
            candidate_fingerprint="$(ssh-keygen -lf "$candidate_file" -E sha256 | awk 'NR == 1 {print $2}')"
            if [[ "$candidate_fingerprint" == "$PRODUCTION_SSH_HOST_KEY_SHA256" ]]; then
              [[ -z "$scanned_fingerprint" ]] || fail 'multiple scanned SSH host keys matched the trusted pin'
              scanned_fingerprint="$candidate_fingerprint"
              printf '%s\n' "$key_line" > "$known_hosts"
            fi
          done < "$scan_file"
          [[ -n "$scanned_fingerprint" ]] || fail 'SSH host fingerprint mismatch; no connection attempted'
          chmod 0600 "$known_hosts"
          rm -f -- "$candidate_file"

          role="agm_acp_ro_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          [[ "$role" =~ ^agm_acp_ro_[0-9]+_[0-9]+$ ]] || fail 'generated role identifier invalid'
          remote_log="$RUNNER_TEMP/agm-acp-readonly-remote.log"
          ssh \
            -i "$key_file" \
            -p 22 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "sudo bash -s -- $role" \
            < .github/scripts/production-acp-readonly-lifecycle.sh | tee "$remote_log"

          grep -Fxq 'ACPM_REMOTE=REVOCATION_VERIFIED role_absent=true sessions=0' "$remote_log" || fail 'mandatory role revocation was not verified'
          grep -Fxq 'ACPM_REMOTE=ACP_PERSISTENCE_READ_PASS existing_event=true event_payload_not_exported=true' "$remote_log" || fail 'read-only ACP persistence evidence missing'

          {
            echo "SSH host key: verified ($scanned_fingerprint)"
            echo "Temporary role identifier: $role; expiry capped at 30 minutes; removal verified."
            echo 'Production table data writes: none; temporary role/grants only.'
            echo 'ACP persistence evidence: existing journal entry found; payload not exported.'
          } >> "$GITHUB_STEP_SUMMARY"

