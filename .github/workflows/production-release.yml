name: AGM Production Release

on:
  workflow_dispatch:
    inputs:
      provision_car_mover:
        description: Provision the approved Car Mover entitlement during this release
        required: false
        default: false
        type: boolean
  push:
    branches: [main, agm-canonical-20260820]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agm-cockpit-api
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agm-cockpit-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Generate ephemeral test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Configure non-production test environment
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci" >> "$GITHUB_ENV"
          echo "OPENAI_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm --filter @agm/copilot-control-plane build
      - run: pnpm --filter @agm/api lint
      - run: pnpm --filter @agm/api test -- --runInBand
      - run: pnpm --filter @agm/api build
      - run: pnpm --filter @agm/web build
      - run: pnpm audit:canonical-route
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm rescue:browser-preflight
      - run: pnpm audit:wave1-browser

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: deploy/cloud/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Export immutable digest
        id: digest
        run: echo "digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish-web:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: deploy/cloud/web.Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
      - name: Export immutable digest
        id: digest
        run: echo "digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [publish, publish-web]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Stage approved Production lifecycle files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: deploy/production/compose.production.yml,deploy/production/agm-production-api.service,deploy/production/agm-production-web.service
          target: /tmp/agm-release-${{ github.run_id }}
      - name: Deploy approved digest through Release & Operations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            export AGM_IMAGE="${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}"
            export AGM_WEB_IMAGE="${{ env.WEB_IMAGE_NAME }}@${{ needs.publish-web.outputs.digest }}"
            export AGM_REVISION="${{ github.sha }}"
            export AGM_WEB_REVISION="${{ github.sha }}"
            release_root="/tmp/agm-release-${{ github.run_id }}/deploy/production"
            rollback_root="/opt/agm/production/rollback/${{ github.run_id }}"
            deployment_stage="initialize"
            sudo install -d -o root -g root -m 0700 "$rollback_root"
            for current in release.env web-release.env compose.production.yml; do
              if sudo test -f "/opt/agm/production/$current"; then
                sudo cp --preserve=mode,timestamps "/opt/agm/production/$current" "$rollback_root/$current"
              fi
            done
            sudo cp --preserve=mode,timestamps /etc/systemd/system/agm-production-api.service "$rollback_root/agm-production-api.service"
            sudo cp --preserve=mode,timestamps /etc/systemd/system/agm-production-web.service "$rollback_root/agm-production-web.service"
            rollback() {
              for previous in release.env web-release.env compose.production.yml; do
                if sudo test -f "$rollback_root/$previous"; then sudo cp "$rollback_root/$previous" "/opt/agm/production/$previous"; fi
              done
              sudo cp "$rollback_root/agm-production-api.service" /etc/systemd/system/agm-production-api.service
              sudo cp "$rollback_root/agm-production-web.service" /etc/systemd/system/agm-production-web.service
              sudo systemctl daemon-reload
              sudo systemctl restart agm-production-api.service || true
              sudo systemctl restart agm-production-web.service || true
            }
            diagnose_and_rollback() {
              failure_code=$?
              trap - ERR
              printf 'AGM_DEPLOY_FAILURE stage=%s exit=%s\n' "$deployment_stage" "$failure_code"
              sudo systemctl status agm-production-api.service --no-pager --full || true
              sudo systemctl status agm-production-web.service --no-pager --full || true
              sudo docker inspect --format 'api={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}}' agm-production-api || true
              sudo docker inspect --format 'web={{.State.Status}} exit={{.State.ExitCode}} image={{.Config.Image}}' agm-production-web || true
              sudo docker logs --tail 120 agm-production-api 2>&1 | sed -E 's#(postgresql://)[^[:space:]]+#\1[REDACTED]#g' || true
              rollback
              exit "$failure_code"
            }
            trap diagnose_and_rollback ERR
            deployment_stage="database-backup"
            database_backup="/tmp/agm-pre-release-${{ github.run_id }}.dump"
            sudo docker exec agm-postgres sh -ceu 'test -n "$POSTGRES_USER"; test -n "$POSTGRES_DB"; pg_isready --quiet; pg_dump --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --format custom --compress 6 --no-owner --no-privileges --file "/tmp/agm-pre-release-${{ github.run_id }}.dump"; pg_restore --list "/tmp/agm-pre-release-${{ github.run_id }}.dump" >/dev/null'
            sudo docker cp "agm-postgres:$database_backup" "$rollback_root/database.dump"
            sudo docker exec agm-postgres rm -f -- "$database_backup"
            sudo chmod 0600 "$rollback_root/database.dump"
            sudo sha256sum "$rollback_root/database.dump" | sudo tee "$rollback_root/database.dump.sha256" >/dev/null
            sudo chmod 0600 "$rollback_root/database.dump.sha256"
            deployment_stage="install-lifecycle-files"
            sudo install -o root -g root -m 0644 "$release_root/compose.production.yml" /opt/agm/production/compose.production.yml
            sudo install -o root -g root -m 0644 "$release_root/agm-production-api.service" /etc/systemd/system/agm-production-api.service
            sudo install -o root -g root -m 0644 "$release_root/agm-production-web.service" /etc/systemd/system/agm-production-web.service
            printf 'AGM_IMAGE=%s\nAGM_REVISION=%s\n' "$AGM_IMAGE" "$AGM_REVISION" | sudo tee /opt/agm/production/release.env >/dev/null
            printf 'AGM_WEB_IMAGE=%s\nAGM_WEB_REVISION=%s\n' "$AGM_WEB_IMAGE" "$AGM_WEB_REVISION" | sudo tee /opt/agm/production/web-release.env >/dev/null
            sudo chmod 0644 /opt/agm/production/release.env
            sudo chmod 0644 /opt/agm/production/web-release.env
            deployment_stage="pull-images"
            sudo docker pull "$AGM_IMAGE"
            sudo docker pull "$AGM_WEB_IMAGE"
            sudo systemctl daemon-reload
            deployment_stage="restart-api"
            sudo systemctl restart agm-production-api.service
            sudo systemctl is-active --quiet agm-production-api.service
            test "$(sudo docker inspect --format '{{.Config.Image}}' agm-production-api)" = "$AGM_IMAGE"
            deployment_stage="api-readiness"
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 https://api.agmcockpit.com/api/v1/health/ready >/dev/null
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 https://api.agmcockpit.com/api/v1/health/live | grep -F 'agent-runtime-events.v1.3' >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.agmcockpit.com/api/v1/agent-runtime-events)" = "401"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.agmcockpit.com/api/v1/authority-control-plane/dashboard)" = "401"
            deployment_stage="restart-web"
            sudo systemctl restart agm-production-web.service
            sudo systemctl is-active --quiet agm-production-web.service
            test "$(sudo docker inspect --format '{{.Config.Image}}' agm-production-web)" = "$AGM_WEB_IMAGE"
            deployment_stage="web-internal-route"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:4173/)" = "308"
            test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://127.0.0.1:4173/)" = "http://127.0.0.1:4173/basic"
            deployment_stage="web-public-route"
            public_route_ready=false
            for attempt in $(seq 1 30); do
              public_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 https://app.agmcockpit.com/ || true)"
              public_redirect="$(curl --silent --output /dev/null --write-out '%{redirect_url}' --max-time 5 https://app.agmcockpit.com/ || true)"
              printf 'AGM_PUBLIC_ROUTE attempt=%s status=%s redirect=%s\n' "$attempt" "$public_status" "$public_redirect"
              if [ "$public_status" = "308" ] && [ "$public_redirect" = "https://app.agmcockpit.com/basic" ]; then
                public_route_ready=true
                break
              fi
              sleep 2
            done
            test "$public_route_ready" = "true"
            curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 https://app.agmcockpit.com/basic | grep -F '/assets/main-' >/dev/null
            curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 https://app.agmcockpit.com/car-mover/menu | grep -F '/assets/main-' >/dev/null
            deployment_stage="complete"
            trap - ERR
      - name: Provision approved Car Mover entitlement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_car_mover }}
        env:
          PROVISIONING_TOKEN: ${{ secrets.PRODUCTION_ROLE_PROVISIONING_TOKEN }}
          TARGET_USER_ID: ${{ secrets.CAR_MOVER_TARGET_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_TOKEN"
          test -n "$TARGET_USER_ID"
          response=$(curl --fail --silent --show-error \
            -X POST https://api.agmcockpit.com/api/v1/auth/role-provisioning/car-mover \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"targetUserId\":\"$TARGET_USER_ID\"}")
          echo "$response" | jq -e '.data.role == "CAR_MOVER_ACCESS" and .data.active == true and (.data.auditEventId | type == "string")'
      - name: Verify canonical M2M lifecycle in Production
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agm%3Aproduction-machine-provisioning")
          PROVISIONING_TOKEN=$(jq -er '.value' <<<"$oidc_response")
          echo "::add-mask::$PROVISIONING_TOKEN"
          client_id=''
          cleanup() {
            if [ -n "$client_id" ]; then
              cleanup_body=$(jq -nc '{reason:"Production release validation cleanup."}')
              curl --fail --silent --show-error \
                -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/revoke" \
                -H "Authorization: Bearer $PROVISIONING_TOKEN" \
                -H 'Content-Type: application/json' \
                --data "$cleanup_body" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          subject="production-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          provision_body=$(jq -nc --arg subject "$subject" '{subject:$subject,expiresInDays:1}')
          provision_result=$(curl --silent --show-error --write-out $'\n%{http_code}' \
            -X POST https://api.agmcockpit.com/api/v1/auth/deploy/machines \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$provision_body")
          provision_status="${provision_result##*$'\n'}"
          provisioned="${provision_result%$'\n'*}"
          if [ "$provision_status" != '201' ]; then
            provision_error=$(jq -c '{statusCode,message,error}' <<<"$provisioned" 2>/dev/null || printf '%s' 'non-json response')
            printf 'M2M_PROVISION_FAILED status=%s response=%s\n' "$provision_status" "$provision_error" >&2
            exit 1
          fi
          client_id=$(jq -er '.data.clientId' <<<"$provisioned")
          company_id=$(jq -er '.data.companyId' <<<"$provisioned")
          credential_id=$(jq -er '.data.credentialId' <<<"$provisioned")
          client_secret=$(jq -er '.data.clientSecret' <<<"$provisioned")
          echo "::add-mask::$client_secret"

          token_body=$(jq -nc --arg id "$client_id" --arg secret "$client_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          issued=$(curl --fail --silent --show-error \
            -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token \
            -H 'Content-Type: application/json' \
            --data "$token_body")
          access_token=$(jq -er '.access_token' <<<"$issued")
          echo "::add-mask::$access_token"
          test "$(jq -er '.scope' <<<"$issued")" = 'acp:read'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            "https://api.agmcockpit.com/api/v1/m2m/authority-control-plane/companies/$company_id/network-registry" | jq -e '.data | type == "array"' >/dev/null

          injected_body=$(jq -nc --arg id "$client_id" --arg secret "$client_secret" --arg company "$company_id" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret,subject:"caller-controlled",companyId:$company}')
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$injected_body")" = '400'

          rotated=$(curl --fail --silent --show-error \
            -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/credentials/rotate" \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"expiresInDays":1}')
          next_credential_id=$(jq -er '.data.credentialId' <<<"$rotated")
          next_client_secret=$(jq -er '.data.clientSecret' <<<"$rotated")
          echo "::add-mask::$next_client_secret"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$token_body")" = '401'

          next_token_body=$(jq -nc --arg id "$client_id" --arg secret "$next_client_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          next_issued=$(curl --fail --silent --show-error -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$next_token_body")
          next_access_token=$(jq -er '.access_token' <<<"$next_issued")
          echo "::add-mask::$next_access_token"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $next_access_token" \
            "https://api.agmcockpit.com/api/v1/m2m/authority-control-plane/companies/$company_id/network-registry" | jq -e '.data | type == "array"' >/dev/null

          revoke_body=$(jq -nc '{reason:"Production release credential lifecycle validation."}')
          curl --fail --silent --show-error \
            -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/credentials/$next_credential_id/revoke" \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$revoke_body" | jq -e '.data.revokedAt | type == "string"' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$next_token_body")" = '401'

          unknown_secret="00000000-0000-4000-8000-000000000099.$(printf 'a%.0s' {1..64})"
          unknown_body=$(jq -nc --arg id "$client_id" --arg secret "$unknown_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$unknown_body")" = '401'
          echo 'M2M_PRODUCTION_LIFECYCLE=PASS'
      - name: Verify Car Mover entitlement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_car_mover }}
        env:
          PROVISIONING_TOKEN: ${{ secrets.PRODUCTION_ROLE_PROVISIONING_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            https://api.agmcockpit.com/api/v1/auth/entitlements | \
            jq -e '.data.capabilities | index("car-mover.jobs") != null'
