name: AGM Production Release

on:
  workflow_dispatch:
    inputs:
      provision_car_mover:
        description: Provision the approved Car Mover entitlement during this release
        required: false
        default: false
        type: boolean
  push:
    branches: [main, agm-canonical-20260820]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agm-cockpit-api
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agm-cockpit-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Generate ephemeral test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Configure non-production test environment
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci" >> "$GITHUB_ENV"
          echo "OPENAI_API_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm --filter @agm/copilot-control-plane build
      - run: pnpm --filter @agm/api lint
      - run: pnpm --filter @agm/api test -- --runInBand
      - run: pnpm --filter @agm/api build
      - run: pnpm --filter @agm/web build
      - run: pnpm --filter @agm/web test:turn-operational-truth
      - run: pnpm audit:canonical-route
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm rescue:browser-preflight
      - run: pnpm audit:wave1-browser

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: deploy/cloud/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Export immutable digest
        id: digest
        run: echo "digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish-web:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: deploy/cloud/web.Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
      - name: Export immutable digest
        id: digest
        run: echo "digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [publish, publish-web]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Prepare encrypted-channel runtime references
        shell: bash
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          GMAIL_FROM_ADDRESS: ${{ secrets.GMAIL_FROM_ADDRESS }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for name in TOMTOM_API_KEY GMAIL_FROM_ADDRESS GMAIL_OAUTH_CLIENT_ID GMAIL_OAUTH_CLIENT_SECRET GMAIL_OAUTH_REFRESH_TOKEN; do
            value="${!name:-}"
            test -n "$value"
            encoded="$(printf '%s' "$value" | base64 --wrap=0)"
            echo "::add-mask::$encoded"
            printf '%s_B64=%s\n' "$name" "$encoded" >> "$GITHUB_ENV"
          done
      - name: Stage approved Production lifecycle files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: deploy/production/compose.production.yml,deploy/production/agm-production-api.service,deploy/production/agm-production-web.service
          target: /tmp/agm-release-${{ github.run_id }}
      - name: Deploy approved digest through Release & Operations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: TOMTOM_API_KEY_B64,GMAIL_FROM_ADDRESS_B64,GMAIL_OAUTH_CLIENT_ID_B64,GMAIL_OAUTH_CLIENT_SECRET_B64,GMAIL_OAUTH_REFRESH_TOKEN_B64
          script: |
            set -euo pipefail
            export AGM_IMAGE="${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}"
            export AGM_WEB_IMAGE="${{ env.WEB_IMAGE_NAME }}@${{ needs.publish-web.outputs.digest }}"
            export AGM_REVISION="${{ github.sha }}"
            export AGM_WEB_REVISION="${{ github.sha }}"
            release_root="/tmp/agm-release-${{ github.run_id }}/deploy/production"
            rollback_root="/opt/agm/production/rollback/${{ github.run_id }}"
            deployment_stage="initialize"
            sudo install -d -o root -g root -m 0700 "$rollback_root"
            for current in release.env web-release.env compose.production.yml; do
              if sudo test -f "/opt/agm/production/$current"; then
                sudo cp --preserve=mode,timestamps "/opt/agm/production/$current" "$rollback_root/$current"
              fi
            done
            if sudo test -f /opt/agm/production/secrets/agm-production.env; then
              sudo cp --preserve=mode,timestamps /opt/agm/production/secrets/agm-production.env "$rollback_root/agm-production.env"
            fi
            sudo cp --preserve=mode,timestamps /etc/systemd/system/agm-production-api.service "$rollback_root/agm-production-api.service"
            sudo cp --preserve=mode,timestamps /etc/systemd/system/agm-production-web.service "$rollback_root/agm-production-web.service"
            if sudo test -f /opt/agm/production/runtime/production-preflight.latest.json; then
              sudo cp --preserve=mode,timestamps /opt/agm/production/runtime/production-preflight.latest.json "$rollback_root/production-preflight.latest.json"
            fi
            rollback() {
              for previous in release.env web-release.env compose.production.yml; do
                if sudo test -f "$rollback_root/$previous"; then sudo cp "$rollback_root/$previous" "/opt/agm/production/$previous"; fi
              done
              if sudo test -f "$rollback_root/agm-production.env"; then
                sudo install -o root -g root -m 0600 "$rollback_root/agm-production.env" /opt/agm/production/secrets/agm-production.env
              fi
              sudo cp "$rollback_root/agm-production-api.service" /etc/systemd/system/agm-production-api.service
              sudo cp "$rollback_root/agm-production-web.service" /etc/systemd/system/agm-production-web.service
              if sudo test -f "$rollback_root/production-preflight.latest.json"; then
                sudo install -d -o root -g root -m 0755 /opt/agm/production/runtime
                sudo install -o root -g root -m 0644 "$rollback_root/production-preflight.latest.json" /opt/agm/production/runtime/production-preflight.latest.json
              fi
              sudo systemctl daemon-reload
              sudo systemctl restart agm-production-api.service || true
              sudo systemctl restart agm-production-web.service || true
            }
            diagnose_and_rollback() {
              failure_code=$?
              trap - ERR
              if [ -n "${secret_candidate:-}" ]; then rm -f -- "$secret_candidate"; fi
              printf 'AGM_DEPLOY_FAILURE stage=%s exit=%s\n' "$deployment_stage" "$failure_code"
              sudo systemctl status agm-production-api.service --no-pager --full || true
              sudo systemctl status agm-production-web.service --no-pager --full || true
              sudo docker inspect --format 'api={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}}' agm-production-api || true
              sudo docker inspect --format 'web={{.State.Status}} exit={{.State.ExitCode}} image={{.Config.Image}}' agm-production-web || true
              sudo docker logs --tail 120 agm-production-api 2>&1 | sed -E 's#(postgresql://)[^[:space:]]+#\1[REDACTED]#g' || true
              rollback
              exit "$failure_code"
            }
            trap diagnose_and_rollback ERR
            deployment_stage="database-backup"
            database_backup="/tmp/agm-pre-release-${{ github.run_id }}.dump"
            sudo docker exec agm-postgres sh -ceu 'test -n "$POSTGRES_USER"; test -n "$POSTGRES_DB"; pg_isready --quiet; pg_dump --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --format custom --compress 6 --no-owner --no-privileges --file "/tmp/agm-pre-release-${{ github.run_id }}.dump"; pg_restore --list "/tmp/agm-pre-release-${{ github.run_id }}.dump" >/dev/null'
            sudo docker cp "agm-postgres:$database_backup" "$rollback_root/database.dump"
            sudo docker exec agm-postgres rm -f -- "$database_backup"
            sudo chmod 0600 "$rollback_root/database.dump"
            sudo sha256sum "$rollback_root/database.dump" | sudo tee "$rollback_root/database.dump.sha256" >/dev/null
            sudo chmod 0600 "$rollback_root/database.dump.sha256"
            deployment_stage="install-lifecycle-files"
            sudo install -o root -g root -m 0644 "$release_root/compose.production.yml" /opt/agm/production/compose.production.yml
            sudo install -o root -g root -m 0644 "$release_root/agm-production-api.service" /etc/systemd/system/agm-production-api.service
            sudo install -o root -g root -m 0644 "$release_root/agm-production-web.service" /etc/systemd/system/agm-production-web.service
            printf 'AGM_IMAGE=%s\nAGM_REVISION=%s\n' "$AGM_IMAGE" "$AGM_REVISION" | sudo tee /opt/agm/production/release.env >/dev/null
            printf 'AGM_WEB_IMAGE=%s\nAGM_WEB_REVISION=%s\n' "$AGM_WEB_IMAGE" "$AGM_WEB_REVISION" | sudo tee /opt/agm/production/web-release.env >/dev/null
            sudo chmod 0644 /opt/agm/production/release.env
            sudo chmod 0644 /opt/agm/production/web-release.env
            deployment_stage="configure-runtime-secret-references"
            secret_env=/opt/agm/production/secrets/agm-production.env
            sudo test -f "$secret_env"
            for encoded_name in TOMTOM_API_KEY_B64 GMAIL_FROM_ADDRESS_B64 GMAIL_OAUTH_CLIENT_ID_B64 GMAIL_OAUTH_CLIENT_SECRET_B64 GMAIL_OAUTH_REFRESH_TOKEN_B64; do
              test -n "${!encoded_name:-}"
            done
            tomtom_api_key="$(printf '%s' "$TOMTOM_API_KEY_B64" | base64 --decode)"
            gmail_from_address="$(printf '%s' "$GMAIL_FROM_ADDRESS_B64" | base64 --decode)"
            gmail_oauth_client_id="$(printf '%s' "$GMAIL_OAUTH_CLIENT_ID_B64" | base64 --decode)"
            gmail_oauth_client_secret="$(printf '%s' "$GMAIL_OAUTH_CLIENT_SECRET_B64" | base64 --decode)"
            gmail_oauth_refresh_token="$(printf '%s' "$GMAIL_OAUTH_REFRESH_TOKEN_B64" | base64 --decode)"
            test -n "$tomtom_api_key"
            test -n "$gmail_from_address"
            test -n "$gmail_oauth_client_id"
            test "${#gmail_oauth_client_secret}" -ge 16
            test "${#gmail_oauth_refresh_token}" -ge 16
            for value in "$tomtom_api_key" "$gmail_from_address" "$gmail_oauth_client_id" "$gmail_oauth_client_secret" "$gmail_oauth_refresh_token"; do
              case "$value" in *$'\n'*|*$'\r'*) exit 1;; esac
            done
            case "$tomtom_api_key" in *[!A-Za-z0-9]*) exit 1;; esac
            case "${tomtom_api_key,,}" in secret|replace-me|change-me-in-development) exit 1;; esac
            case "$gmail_from_address" in *@*.*) ;; *) exit 1;; esac
            case "$gmail_oauth_client_id" in *.apps.googleusercontent.com) ;; *) exit 1;; esac
            secret_candidate="$(mktemp)"
            sudo awk '!/^(TOMTOM_API_KEY|GMAIL_FROM_ADDRESS|GMAIL_OAUTH_CLIENT_ID|GMAIL_OAUTH_CLIENT_SECRET|GMAIL_OAUTH_REFRESH_TOKEN)=/' "$secret_env" > "$secret_candidate"
            printf 'TOMTOM_API_KEY=%s\nGMAIL_FROM_ADDRESS=%s\nGMAIL_OAUTH_CLIENT_ID=%s\nGMAIL_OAUTH_CLIENT_SECRET=%s\nGMAIL_OAUTH_REFRESH_TOKEN=%s\n' \
              "$tomtom_api_key" "$gmail_from_address" "$gmail_oauth_client_id" "$gmail_oauth_client_secret" "$gmail_oauth_refresh_token" >> "$secret_candidate"
            sudo install -o root -g root -m 0600 "$secret_candidate" "$secret_env"
            rm -f -- "$secret_candidate"
            unset tomtom_api_key gmail_from_address gmail_oauth_client_id gmail_oauth_client_secret gmail_oauth_refresh_token
            deployment_stage="production-preflight-in-progress"
            sudo install -d -o root -g root -m 0755 /opt/agm/production/runtime
            preflight_path=/opt/agm/production/runtime/production-preflight.latest.json
            if sudo test -d "$preflight_path"; then sudo rmdir "$preflight_path"; fi
            preflight_checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sudo tee "$preflight_path" >/dev/null <<EOF
            {"contract":"agm-production-preflight.v1","environment":"production","revision":"$AGM_REVISION","producer":"AGM_PRODUCTION_RELEASE","checkedAt":"$preflight_checked_at","overallStatus":"ATTENTION","checks":[{"id":"ssh-identity","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Release deployment is in progress."},{"id":"ssh-agent","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Release deployment is in progress."},{"id":"ssh-connectivity","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Release deployment is in progress."},{"id":"ssh-authentication","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Release deployment is in progress."},{"id":"console-rescue","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Rollback evidence is being prepared."},{"id":"production-api","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Production runtime is being replaced."},{"id":"guardian-telemetry","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Guardian runtime validation is pending."},{"id":"recovery-procedure","status":"NOT CONFIGURED","checkedAt":"$preflight_checked_at","safeDetail":"Final recovery validation is pending."}]}
            EOF
            sudo chmod 0644 "$preflight_path"
            deployment_stage="pull-images"
            sudo docker pull "$AGM_IMAGE"
            sudo docker pull "$AGM_WEB_IMAGE"
            sudo systemctl daemon-reload
            deployment_stage="restart-api"
            sudo systemctl restart agm-production-api.service
            sudo systemctl is-active --quiet agm-production-api.service
            test "$(sudo docker inspect --format '{{.Config.Image}}' agm-production-api)" = "$AGM_IMAGE"
            deployment_stage="api-readiness"
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 https://api.agmcockpit.com/api/v1/health/ready >/dev/null
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 https://api.agmcockpit.com/api/v1/health/live | grep -F 'agent-runtime-events.v1.3' >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.agmcockpit.com/api/v1/agent-runtime-events)" = "401"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.agmcockpit.com/api/v1/authority-control-plane/dashboard)" = "401"
            sudo docker exec agm-production-api node -e 'const e=process.env;const checks=[["session-signing",(e.JWT_SECRET||"").length>=32],["database-connection",/^postgres(?:ql)?:\/\//i.test(e.DATABASE_URL||"")],["translation-provider",(e.OPENAI_API_KEY||"").length>=20],["live-mobility-tomtom",/^[A-Za-z0-9]+$/.test(e.TOMTOM_API_KEY||"")],["gmail-oauth-client",(e.GMAIL_OAUTH_CLIENT_ID||"").endsWith(".apps.googleusercontent.com")],["gmail-oauth-client-secret",(e.GMAIL_OAUTH_CLIENT_SECRET||"").length>=16],["gmail-oauth-refresh",(e.GMAIL_OAUTH_REFRESH_TOKEN||"").length>=16],["turn-administration",e.AGM_TURN_ADMIN_ACCESS_MODE==="open-pre-release"||/^\$2[aby]\$\d{2}\$/.test(e.AGM_TURN_ADMIN_PIN_HASH||"")]];const attention=checks.filter(([,ok])=>!ok).map(([id])=>id);process.stdout.write(JSON.stringify({contract:"agm-secret-reference-preflight.v1",configured:checks.length-attention.length,attention}));if(attention.length)process.exit(1)'
            deployment_stage="restart-web"
            sudo systemctl restart agm-production-web.service
            sudo systemctl is-active --quiet agm-production-web.service
            test "$(sudo docker inspect --format '{{.Config.Image}}' agm-production-web)" = "$AGM_WEB_IMAGE"
            deployment_stage="web-internal-route"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:4173/)" = "308"
            test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://127.0.0.1:4173/)" = "http://127.0.0.1:4173/basic"
            deployment_stage="web-public-route"
            public_route_ready=false
            for attempt in $(seq 1 30); do
              public_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 https://app.agmcockpit.com/ || true)"
              public_redirect="$(curl --silent --output /dev/null --write-out '%{redirect_url}' --max-time 5 https://app.agmcockpit.com/ || true)"
              printf 'AGM_PUBLIC_ROUTE attempt=%s status=%s redirect=%s\n' "$attempt" "$public_status" "$public_redirect"
              if [ "$public_status" = "308" ] && [ "$public_redirect" = "https://app.agmcockpit.com/basic" ]; then
                public_route_ready=true
                break
              fi
              sleep 2
            done
            test "$public_route_ready" = "true"
            curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 https://app.agmcockpit.com/basic | grep -F '/assets/main-' >/dev/null
            curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors --max-time 5 https://app.agmcockpit.com/car-mover/menu | grep -F '/assets/main-' >/dev/null
            deployment_stage="complete"
            trap - ERR
      - name: Provision approved Car Mover entitlement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_car_mover }}
        env:
          PROVISIONING_TOKEN: ${{ secrets.PRODUCTION_ROLE_PROVISIONING_TOKEN }}
          TARGET_USER_ID: ${{ secrets.CAR_MOVER_TARGET_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_TOKEN"
          test -n "$TARGET_USER_ID"
          response=$(curl --fail --silent --show-error \
            -X POST https://api.agmcockpit.com/api/v1/auth/role-provisioning/car-mover \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"targetUserId\":\"$TARGET_USER_ID\"}")
          echo "$response" | jq -e '.data.role == "CAR_MOVER_ACCESS" and .data.active == true and (.data.auditEventId | type == "string")'
      - name: Verify canonical M2M lifecycle in Production
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agm%3Aproduction-machine-provisioning")
          PROVISIONING_TOKEN=$(jq -er '.value' <<<"$oidc_response")
          echo "::add-mask::$PROVISIONING_TOKEN"
          client_id=''
          cleanup() {
            if [ -n "$client_id" ]; then
              cleanup_body=$(jq -nc '{reason:"Production release validation cleanup."}')
              curl --fail --silent --show-error \
                -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/revoke" \
                -H "Authorization: Bearer $PROVISIONING_TOKEN" \
                -H 'Content-Type: application/json' \
                --data "$cleanup_body" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          subject="production-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          provision_body=$(jq -nc --arg subject "$subject" '{subject:$subject,expiresInDays:1}')
          provision_result=$(curl --silent --show-error --write-out $'\n%{http_code}' \
            -X POST https://api.agmcockpit.com/api/v1/auth/deploy/machines \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$provision_body")
          provision_status="${provision_result##*$'\n'}"
          provisioned="${provision_result%$'\n'*}"
          if [ "$provision_status" != '201' ]; then
            provision_error=$(jq -c '{statusCode,message,error}' <<<"$provisioned" 2>/dev/null || printf '%s' 'non-json response')
            printf 'M2M_PROVISION_FAILED status=%s response=%s\n' "$provision_status" "$provision_error" >&2
            exit 1
          fi
          client_id=$(jq -er '.data.clientId' <<<"$provisioned")
          company_id=$(jq -er '.data.companyId' <<<"$provisioned")
          credential_id=$(jq -er '.data.credentialId' <<<"$provisioned")
          client_secret=$(jq -er '.data.clientSecret' <<<"$provisioned")
          echo "::add-mask::$client_secret"

          token_body=$(jq -nc --arg id "$client_id" --arg secret "$client_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          issued=$(curl --fail --silent --show-error \
            -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token \
            -H 'Content-Type: application/json' \
            --data "$token_body")
          access_token=$(jq -er '.access_token' <<<"$issued")
          echo "::add-mask::$access_token"
          test "$(jq -er '.scope' <<<"$issued")" = 'acp:read'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            "https://api.agmcockpit.com/api/v1/m2m/authority-control-plane/companies/$company_id/network-registry" | jq -e '.data | type == "array"' >/dev/null

          injected_body=$(jq -nc --arg id "$client_id" --arg secret "$client_secret" --arg company "$company_id" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret,subject:"caller-controlled",companyId:$company}')
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$injected_body")" = '400'

          rotated=$(curl --fail --silent --show-error \
            -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/credentials/rotate" \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"expiresInDays":1}')
          next_credential_id=$(jq -er '.data.credentialId' <<<"$rotated")
          next_client_secret=$(jq -er '.data.clientSecret' <<<"$rotated")
          echo "::add-mask::$next_client_secret"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$token_body")" = '401'

          next_token_body=$(jq -nc --arg id "$client_id" --arg secret "$next_client_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          next_issued=$(curl --fail --silent --show-error -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$next_token_body")
          next_access_token=$(jq -er '.access_token' <<<"$next_issued")
          echo "::add-mask::$next_access_token"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $next_access_token" \
            "https://api.agmcockpit.com/api/v1/m2m/authority-control-plane/companies/$company_id/network-registry" | jq -e '.data | type == "array"' >/dev/null

          identity_ref="sha256:$(printf '%s' "$client_id" | sha256sum | cut -d' ' -f1)"
          credential_ref="sha256:$(printf '%s' "$next_credential_id" | sha256sum | cut -d' ' -f1)"
          operational_truth=$(curl --fail --silent --show-error \
            https://api.agmcockpit.com/api/v1/operations/turn/operational-truth)
          jq -e --arg identity "$identity_ref" --arg credential "$credential_ref" '
            .data
            | .contractVersion == "turn-operational-truth.v1"
              and .overallStatus == "PASS"
              and .authStatus == "M2M AUTHENTICATED"
              and .telemetryStatus == "LIVE TELEMETRY"
              and .falseGreen == 0
              and .unexplainedDegraded == 0
              and .chain.machineIdentity.status == "VERIFIED"
              and .chain.machineIdentity.ref == $identity
              and .chain.credential.status == "VERIFIED"
              and .chain.credential.ref == $credential
              and .chain.token.status == "VERIFIED"
              and .chain.token.scope == "acp:read"
              and .chain.authenticatedAcpRead.status == "PASS"
              and .chain.authenticatedAcpRead.responseDigest == .latestEvent.evidenceHash
              and .chain.authenticatedAcpRead.requestId == .latestEvent.dossierId
              and .chain.telemetry.status == "PASS"
              and .chain.eventStore.status == "PERSISTED"
              and .chain.eventStore.eventId == .latestEvent.eventId
              and .chain.api.status == "PASS"
              and .chain.turn.status == "EVIDENCE AVAILABLE"
              and .chain.ui.status == "READY FOR LIVE RENDER"
          ' <<<"$operational_truth" >/dev/null
          jq -c '{contractVersion:.data.contractVersion,overallStatus:.data.overallStatus,reason:.data.reason,observedAt:.data.observedAt,ageSeconds:.data.ageSeconds,authStatus:.data.authStatus,telemetryStatus:.data.telemetryStatus,falseGreen:.data.falseGreen,unexplainedDegraded:.data.unexplainedDegraded,eventStore:.data.chain.eventStore.status,turn:.data.chain.turn.status}' <<<"$operational_truth"
          echo 'TURN_OPERATIONAL_TRUTH=PASS'

          revoke_body=$(jq -nc '{reason:"Production release credential lifecycle validation."}')
          curl --fail --silent --show-error \
            -X POST "https://api.agmcockpit.com/api/v1/auth/deploy/machines/$client_id/credentials/$next_credential_id/revoke" \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$revoke_body" | jq -e '.data.revokedAt | type == "string"' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$next_token_body")" = '401'

          unknown_secret="00000000-0000-4000-8000-000000000099.$(printf 'a%.0s' {1..64})"
          unknown_body=$(jq -nc --arg id "$client_id" --arg secret "$unknown_secret" '{grant_type:"client_credentials",client_id:$id,client_secret:$secret}')
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://api.agmcockpit.com/api/v1/auth/m2m/token -H 'Content-Type: application/json' --data "$unknown_body")" = '401'
          echo 'M2M_PRODUCTION_LIFECYCLE=PASS'
      - name: Verify Car Mover entitlement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.provision_car_mover }}
        env:
          PROVISIONING_TOKEN: ${{ secrets.PRODUCTION_ROLE_PROVISIONING_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $PROVISIONING_TOKEN" \
            https://api.agmcockpit.com/api/v1/auth/entitlements | \
            jq -e '.data.capabilities | index("car-mover.jobs") != null'
      - name: Publish current Production preflight automatically
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            expected_revision="${{ github.sha }}"
            rollback_root="/opt/agm/production/rollback/${{ github.run_id }}"
            preflight_path=/opt/agm/production/runtime/production-preflight.latest.json
            test -n "${SSH_CONNECTION:-}"
            sudo test -f "$rollback_root/database.dump"
            sudo test -f "$rollback_root/database.dump.sha256"
            sudo sha256sum --check "$rollback_root/database.dump.sha256" >/dev/null
            sudo systemctl is-active --quiet agm-production-api.service
            sudo systemctl is-active --quiet agm-production-web.service
            test "$(sudo docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' agm-production-api)" = "$expected_revision"
            curl --fail --silent --show-error --max-time 5 https://api.agmcockpit.com/api/v1/health/live >/dev/null
            curl --fail --silent --show-error --max-time 5 https://api.agmcockpit.com/api/v1/health/ready >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 https://api.agmcockpit.com/api/v1/security/secrets/health)" = "401"
            sudo docker exec agm-production-api node -e 'const e=process.env;const checks=[["session-signing",(e.JWT_SECRET||"").length>=32],["database-connection",/^postgres(?:ql)?:\/\//i.test(e.DATABASE_URL||"")],["translation-provider",(e.OPENAI_API_KEY||"").length>=20],["live-mobility-tomtom",/^[A-Za-z0-9]+$/.test(e.TOMTOM_API_KEY||"")],["gmail-oauth-client",(e.GMAIL_OAUTH_CLIENT_ID||"").endsWith(".apps.googleusercontent.com")],["gmail-oauth-client-secret",(e.GMAIL_OAUTH_CLIENT_SECRET||"").length>=16],["gmail-oauth-refresh",(e.GMAIL_OAUTH_REFRESH_TOKEN||"").length>=16],["turn-administration",e.AGM_TURN_ADMIN_ACCESS_MODE==="open-pre-release"||/^\$2[aby]\$\d{2}\$/.test(e.AGM_TURN_ADMIN_PIN_HASH||"")]];const attention=checks.filter(([,ok])=>!ok).map(([id])=>id);process.stdout.write(JSON.stringify({contract:"agm-secret-reference-preflight.v1",configured:checks.length-attention.length,attention}));if(attention.length)process.exit(1)'
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 https://app.agmcockpit.com/basic)" = "200"
            preflight_checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            sudo tee "$preflight_path" >/dev/null <<EOF
            {"contract":"agm-production-preflight.v1","environment":"production","revision":"$expected_revision","producer":"AGM_PRODUCTION_RELEASE","checkedAt":"$preflight_checked_at","overallStatus":"READY","checks":[{"id":"ssh-identity","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The isolated GitHub Release identity opened this authenticated Production session."},{"id":"ssh-agent","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The dedicated deployment key was supplied directly; no interactive ssh-agent dependency is required."},{"id":"ssh-connectivity","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The current non-interactive SSH Production channel is connected."},{"id":"ssh-authentication","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The approved Production account executed service and container verification successfully."},{"id":"console-rescue","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The revision-bound database backup and checksum are present for automated rollback."},{"id":"production-api","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"The exact API revision is deployed; public live and ready checks returned success."},{"id":"guardian-telemetry","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"All eight active Guardian references were validated inside the Production API container; values remained redacted."},{"id":"recovery-procedure","status":"PASS","checkedAt":"$preflight_checked_at","safeDetail":"API and Web lifecycle services are active and the rollback package is available."}]}
            EOF
            sudo chmod 0644 "$preflight_path"
            sudo docker exec agm-production-api node -e 'const fs=require("node:fs");const report=JSON.parse(fs.readFileSync("/run/agm/production-preflight.latest.json","utf8"));if(report.contract!=="agm-production-preflight.v1"||report.revision!==process.env.AGM_REVISION||report.checks.length!==8||report.checks.some((check)=>check.status!=="PASS"))process.exit(1)'
            echo 'PRODUCTION_PREFLIGHT=READY OWNER_ACTION=NONE'
