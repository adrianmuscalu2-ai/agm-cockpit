name: AGM Production Company Owner Read-Only Preflight

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Read-only scope; no seed, deployment or database mutation
        required: false
        default: COMPANY_OWNER
        type: choice
        options:
          - COMPANY_OWNER
          - ATLAS_POST_LOGIN

permissions:
  contents: read

concurrency:
  group: agm-production-company-owner-preflight
  cancel-in-progress: false

jobs:
  company-owner-preflight:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Guardian-authorized SSH transport
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_SSH_KEY"
          ssh_key_file="$RUNNER_TEMP/agm-production-ssh-key"
          known_hosts_file="$RUNNER_TEMP/agm-production-known-hosts"
          umask 077
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$ssh_key_file"
          chmod 0600 "$ssh_key_file"
          ssh-keyscan -T 15 -H "$PRODUCTION_HOST" > "$known_hosts_file"
          test -s "$known_hosts_file"
          printf 'AGM_SSH_KEY_FILE=%s\nAGM_SSH_KNOWN_HOSTS_FILE=%s\n' "$ssh_key_file" "$known_hosts_file" >> "$GITHUB_ENV"

      - name: Read-only company owner preflight
        if: ${{ inputs.scope != 'ATLAS_POST_LOGIN' }}
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$SEED_OWNER_EMAIL"
          owner_email_arg=$(printf '%q' "$SEED_OWNER_EMAIL")
          cat <<'NODE' | ssh -i "$AGM_SSH_KEY_FILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$AGM_SSH_KNOWN_HOSTS_FILE" \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "sudo docker exec -i -w /app -e OWNER_EMAIL=$owner_email_arg agm-production-api node -"
          (async () => {
            const { PrismaClient } = require("@prisma/client");
            const prisma = new PrismaClient();
            try {
              const companyId = "00000000-0000-0000-0000-000000000001";
              const email = process.env.OWNER_EMAIL;
              if (!email) throw new Error("OWNER_EMAIL_MISSING");
              const users = await prisma.user.findMany({
                where: { email },
                select: {
                  status: true,
                  companyId: true,
                  roles: { select: { companyId: true, role: { select: { code: true, isActive: true } } } },
                },
              });
              const companyUsers = users.filter((candidate) => candidate.companyId === companyId);
              if (companyUsers.length > 1) throw new Error("OWNER_IDENTITY_NOT_UNIQUE");
              const user = companyUsers[0];
              const ownerRoles = user?.roles.filter((item) => item.companyId === companyId && item.role.code === "company_owner" && item.role.isActive) ?? [];
              process.stdout.write(JSON.stringify({
                userExists: Boolean(user),
                status: user?.status === "Active" ? "Active" : user ? "Inactive" : "Inexistent",
                companyOwnerRoleExists: ownerRoles.length > 0,
                companyCorrect: Boolean(user && user.companyId === companyId),
              }) + "\n");
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Read-only inventory of Production company owners
        if: ${{ inputs.scope != 'ATLAS_POST_LOGIN' }}
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          cat <<'NODE' | ssh -i "$AGM_SSH_KEY_FILE" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$AGM_SSH_KNOWN_HOSTS_FILE" \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "sudo docker exec -i -w /app agm-production-api node -"
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          const companyId = "00000000-0000-0000-0000-000000000001";
          (async () => {
            try {
              const users = await prisma.user.findMany({
                where: { companyId },
                select: {
                  status: true,
                  roles: { where: { companyId }, select: { role: { select: { code: true, isActive: true } } } },
                },
              });
              const owners = users.filter((user) => user.roles.some((item) => item.role.code === "company_owner" && item.role.isActive));
              const activeOwners = owners.filter((user) => user.status === "Active");
              process.stdout.write(JSON.stringify({
                companyOwnerExists: owners.length > 0,
                activeCompanyOwnerExists: activeOwners.length > 0,
                companyOwnerCount: owners.length,
                activeCompanyOwnerCount: activeOwners.length,
                statuses: [...new Set(owners.map((user) => user.status))].sort(),
              }) + "\\n");
            } finally {
              await prisma.$disconnect();
            }
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Read-only Atlas registry, post-login proof and HTTP boundary inspection
        if: ${{ inputs.scope == 'ATLAS_POST_LOGIN' }}
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          remote_script="/tmp/agm-atlas-readonly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.py"
          script_hash=$(sha256sum apps/api/scripts/production-atlas-custody.py | cut -d ' ' -f 1)
          scp -i "$AGM_SSH_KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$AGM_SSH_KNOWN_HOSTS_FILE" \
            apps/api/scripts/production-atlas-custody.py "$PRODUCTION_USER@$PRODUCTION_HOST:$remote_script"
          ssh -i "$AGM_SSH_KEY_FILE" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$AGM_SSH_KNOWN_HOSTS_FILE" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "test \"\$(sha256sum '$remote_script' | cut -d ' ' -f 1)\" = '$script_hash' && sudo python3 '$remote_script' --inspect-http; result=\$?; rm -f '$remote_script'; exit \$result" \
            | tee "$RUNNER_TEMP/atlas-readonly-preflight.json"
      - name: Preserve metadata-only Atlas preflight evidence
        if: ${{ always() && inputs.scope == 'ATLAS_POST_LOGIN' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-readonly-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlas-readonly-preflight.json
          if-no-files-found: warn
          retention-days: 90
      - name: Explicitly confirm no Production mutation
        run: echo 'READ_ONLY_PREFLIGHT_ONLY=PASS; SEED=NOT_EXECUTED; DEPLOY=NOT_EXECUTED; DATABASE_MUTATION=NONE'
