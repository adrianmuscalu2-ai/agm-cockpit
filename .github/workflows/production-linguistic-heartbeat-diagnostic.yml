name: Isolated Production linguistic heartbeat diagnostic

on:
  push:
    branches:
      - diagnostic/linguistic-heartbeat-20260921
    paths:
      - .github/workflows/production-linguistic-heartbeat-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: isolated-production-linguistic-heartbeat-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Run isolated browser diagnostic
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked diagnostic dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared linguistic contract
        run: pnpm --filter @agm/shared build
      - name: Install controlled diagnostic Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser preflight
        run: pnpm rescue:browser-preflight
      - name: Run Production linguistic heartbeat diagnostic once
        env:
          AGM_LINGUISTIC_RELEASE_URL: https://app.agmcockpit.com/turn
          AGM_LINGUISTIC_RELEASE_API_URL: https://api.agmcockpit.com/api/v1
          AGM_TURN_ADMIN_PIN: ${{ secrets.PRODUCTION_TURN_ADMIN_PIN }}
          AGM_EXPECTED_REVISION: 940cd3c3fa8e0be5cfbdd252295dd4b17b38c57e
          AGM_LINGUISTIC_RELEASE_EVIDENCE: evidence/agent-accountability/production/linguistic-heartbeat-publication.json
        run: node scripts/publish-production-linguistic-heartbeats-browser.mjs
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-linguistic-heartbeat-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/agent-accountability/production/linguistic-heartbeat-publication.json
          if-no-files-found: error
          retention-days: 30
